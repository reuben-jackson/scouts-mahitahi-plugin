name: Release

# Publishes a GitHub release with the Chrome, Edge and Firefox zips
# whenever a version tag such as v1.6.0 is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag matches package.json version
        run: |
          if [ "v$(node -p "require('./package.json').version")" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version" >&2
            exit 1
          fi

      - name: Syntax check
        run: node --check src/content.js && node --check src/page-hook.js && node --check src/invoice-export.js && node --check src/invoice-ui.js

      - name: Invoice conversion tests
        run: npm test

      - name: Build and zip
        run: npm run package

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---

          ## How to install

          Download the zip for your browser below (under **Assets**), then:

          **Chrome / Edge**
          1. Unzip it to a folder you'll keep (don't delete or move it afterwards).
          2. Go to `chrome://extensions` (Edge: `edge://extensions`) and turn on **Developer mode**.
          3. Click **Load unpacked** and choose the unzipped folder.
          4. Reload Mahi Tahi.

          **Firefox 128+** (temporary until restart)
          1. Unzip it, then go to `about:debugging#/runtime/this-firefox`.
          2. Click **Load Temporary Add-on** and choose `manifest.json` in the folder.

          Updating: download the new zip, replace the old folder's contents, then click the reload icon on the extension's card.
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.zip
